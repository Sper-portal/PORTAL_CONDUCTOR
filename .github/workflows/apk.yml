name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias y sincronizar
        working-directory: portal
        run: |
          npm ci || npm install
          npx cap sync android
      - name: Compilar APK
        working-directory: portal/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: portal-apk
          path: portal/android/app/build/outputs/apk/debug/app-debug.apk
